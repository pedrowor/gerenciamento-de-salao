name: Python tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tkinter for Python
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
